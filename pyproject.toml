[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "georeset-text-label-benchmark"
version = "0.1.0"
description = "Build reproducible geospatial text-label benchmark data."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{ name = "Noé Flandre" }]
dependencies = [
    "fsspec>=2024.3.1",
    "huggingface-hub>=1.6.0,<2.0.0",
    "pyarrow>=20.0.0",
]

[project.optional-dependencies]
pilot = [
    "torch>=2.7,<3.0",
    "transformers>=5.0,<6.0",
]
dspark = [
    "sglang==0.5.20",
    "flashinfer-python[cu13]==0.6.18",
    "transformers>=5.0,<6.0",
]

[project.scripts]
georeset-benchmark = "georeset_text_label_benchmark.cli:main"
georeset-pilot = "georeset_text_label_benchmark.pilot.cli:main"

[dependency-groups]
dev = [
    "mkdocs-material>=9.6.0",
    "mkdocs>=1.6.1",
    "mutmut>=3.7.0",
    "pytest-cov>=6.0.0",
    "pytest>=8.3.0",
    "ruff>=0.14.13",
    "ty>=0.0.78",
]

[tool.hatch.build.targets.wheel]
packages = ["src/georeset_text_label_benchmark"]

[tool.hatch.build.targets.wheel.force-include]
"src/georeset_text_label_benchmark/pilot/pinned_cache_files.json" = "georeset_text_label_benchmark/pilot/pinned_cache_files.json"

[tool.uv]
conflicts = [[{ extra = "pilot" }, { extra = "dspark" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["georeset_text_label_benchmark"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "C901", "E4", "E7", "E9", "F", "I", "PT", "RUF", "SIM", "UP"]
mccabe.max-complexity = 5

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.mutmut]
source_paths = ["src/georeset_text_label_benchmark/"]
pytest_add_cli_args_test_selection = ["tests"]
dict_synonyms = ["Dict"]
on_dependency_change = "rerun"
# PyTorch is imported by the test suite; forkserver avoids inheriting fork-unsafe runtime state.
process_isolation = "forkserver"
# Allow for forkserver and pytest startup variance on shared CI runners.
timeout_constant = 3.0
